backend:
  name: github
  repo: MichaelBuss/wro
  branch: main

media_folder: public/uploads
public_folder: /uploads

# Image settings — keep in sync with scripts/image-settings.ts
media_libraries:
  all:
    slugify_filename: true
    max_file_size: 10485760 # 10 MB source limit before optimization
    transformations:
      raster_image:
        format: webp # IMAGE_FORMAT
        quality: 85 # IMAGE_QUALITY
        width: 2048 # IMAGE_MAX_PX
        height: 2048 # IMAGE_MAX_PX
      svg:
        optimize: true

collections:
  - name: blog
    label: Blog Posts
    folder: content/blog
    create: true
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: date, widget: datetime }
      - {
          label: Description,
          name: description,
          widget: text,
          required: false,
        }
      - {
          label: Featured Image,
          name: image,
          widget: image,
          required: false,
        }
      - { label: Body, name: body, widget: markdown }

  - name: gallery
    label: Galleri
    folder: content/gallery
    create: true
    slug: '{{slug}}'
    hint: Photos are grouped by year on the /galleri page. Favorited photos appear in the homepage preview and as the highlight teaser for their year.
    fields:
      - { label: Image, name: image, widget: image }
      - { label: Alt Text, name: alt, widget: string }
      - {
          label: Description,
          name: description,
          widget: text,
          required: false,
        }
      - {
          label: Year,
          name: year,
          widget: number,
          required: false,
          hint: Groups the photo under this year on the /galleri page. Left blank, it appears under "Andre billeder".,
        }
      - {
          label: Favorite,
          name: favorite,
          widget: boolean,
          default: false,
          hint: Favorited photos are prioritized on the homepage and as the year's highlight teaser,
        }
      - {
          label: Focal Point,
          name: position,
          widget: string,
          required: false,
          hint: 'CSS object-position value, e.g. "top center", "center", "bottom right"',
        }
      - {
          label: Sort Order,
          name: order,
          widget: number,
          required: false,
          hint: Lower numbers appear first,
        }

  - name: quotes
    label: Participant Quotes
    folder: content/quotes
    create: true
    slug: '{{slug}}'
    hint: Testimonials from past participants. The quote with the lowest order number appears featured on the homepage.
    fields:
      - { label: Quote, name: quote, widget: text }
      - {
          label: Author,
          name: author,
          widget: string,
          hint: 'e.g. "Marcus, 15 år"',
        }
      - {
          label: Team,
          name: team,
          widget: string,
          hint: 'e.g. "Team RoboNinja, finalist 2024"',
        }
      - {
          label: Sort Order,
          name: order,
          widget: number,
          hint: Lower numbers appear first. Order 1 is featured on the homepage.,
        }

  - name: practical-tips
    label: Practical Tips
    folder: content/practical-tips
    create: true
    slug: '{{slug}}'
    hint: Competition preparation tips. The three with the lowest order numbers appear on the homepage.
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - {
          label: Sort Order,
          name: order,
          widget: number,
          hint: Lower numbers appear first. Orders 1–3 appear on the homepage.,
        }

  - name: pages
    label: Pages
    files:
      - name: homepage
        label: Homepage
        file: content/pages/homepage.md
        fields:
          - { label: Hero Heading, name: hero_heading, widget: string }
          - {
              label: Hero Heading Accent,
              name: hero_heading_accent,
              widget: string,
            }
          - { label: Hero Subheading, name: hero_subheading, widget: string }
          - { label: Hero Description, name: hero_description, widget: text }
          - { label: CTA Button Text, name: cta_text, widget: string }
          - { label: CTA Subtext, name: cta_subtext, widget: string }

      - name: event-info
        label: Event Info
        file: content/pages/event-info.md
        fields:
          - {
              label: Danish Final Date,
              name: danish_final_date,
              widget: datetime,
              date_format: 'YYYY-MM-DD',
              time_format: false,
            }
          - {
              label: Danish Final Location,
              name: danish_final_location,
              widget: string,
            }
          - {
              label: Danish Final Time,
              name: danish_final_time,
              widget: string,
            }
          - {
              label: World Final Location,
              name: world_final_location,
              widget: string,
            }

      - name: prizes
        label: Prizes
        file: content/pages/prizes.md
        hint: Prize podium entries are ordered — first entry = 1st place, second = 2nd place, etc.
        fields:
          - label: Prize Podium
            name: prizes
            widget: list
            fields:
              - {
                  label: Label,
                  name: label,
                  widget: string,
                  hint: 'e.g. "1. plads — Hovedpræmien"',
                }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - { label: Tip Box Heading, name: tip_heading, widget: string }
          - { label: Tip Box Body, name: tip_body, widget: text }

      - name: cost
        label: Cost
        file: content/pages/cost.md
        fields:
          - {
              label: Headline,
              name: headline,
              widget: string,
              hint: 'The large typographic statement, e.g. "GRATIS"',
            }
          - {
              label: Tagline,
              name: tagline,
              widget: string,
              hint: One-liner below the headline,
            }
          - label: Homepage Tag Pills
            name: homepage_tags
            widget: list
            field: { label: Tag, name: tag, widget: string }
            hint: Short labels shown as pills on the homepage teaser
          - label: Free Items
            name: free_items
            widget: list
            field: { label: Item, name: item, widget: string }
          - label: Own Expenses
            name: expenses
            widget: list
            fields:
              - {
                  label: Amount,
                  name: amount,
                  widget: string,
                  hint: 'e.g. "~500–800 kr" or "Varierer"',
                }
              - { label: Description, name: description, widget: string }
          - { label: Tip Box Heading, name: tip_heading, widget: string }
          - { label: Tip Box Body, name: tip_body, widget: text }
          - {
              label: Support Section Heading,
              name: support_heading,
              widget: string,
            }
          - { label: Support Section Body, name: support_body, widget: text }

      - name: materials
        label: Materials
        file: content/pages/materials.md
        fields:
          - { label: Intro, name: intro, widget: text }
          - label: Robot Kits
            name: kits
            widget: list
            hint: Kits marked as "recommended" appear on the homepage.
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
              - {
                  label: Recommended,
                  name: recommended,
                  widget: boolean,
                  default: false,
                }
          - label: Other Items Needed
            name: other_items
            widget: list
            field: { label: Item, name: item, widget: string }
          - { label: Official Rules URL, name: rules_url, widget: string }
